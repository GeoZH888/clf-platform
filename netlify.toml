#  å¤§å«å­¦ä¸­æ–‡ â€” Netlify config
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Supabase ANON URL + KEY are public by design (anon role, RLS-protected).
  # Disable secrets scanning entirely â€” this is a SPA and all the keys
  # exposed in bundle (anon, public CDN URLs) are intentionally so.
  # OMIT_KEYS alone wasn't enough â€” Netlify still scanned & redacted values.
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler          = "esbuild"
  included_files        = ["netlify/functions/**/*.json"]
  # IMPORTANT: every parser lib used by a function MUST be in external_node_modules,
  # otherwise esbuild tries to bundle them into the Lambda and breaks on native deps.
  external_node_modules = ["pdf-parse", "pdf2json", "adm-zip", "mammoth", "xlsx"]

# â”€â”€â”€ Long-running functions (900s = 15 min, max for Pro background) â”€â”€â”€â”€
[functions."process-pdf"]
  timeout = 900

[functions."process-zip"]
  timeout = 900

[functions."classify-embed"]
  timeout = 900

[functions."rag-search"]
  timeout = 900

[functions."process-document"]
  timeout = 900

[functions."process-document-background"]
  timeout = 900

[functions."process-zip-corpus-background"]
  timeout = 900

[functions."batch-translate-mnemonics"]
  timeout = 900

# â”€â”€â”€ Shorter functions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
[functions."generate-illustration"]
  timeout = 60   # Stability Ultra can take 20-40s

[functions."azure-tts-speak"]
  timeout = 30

# â”€â”€â”€ Routing â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# â”€â”€â”€ Dev â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
[dev]
  command    = "npm run dev"
  port       = 8888
  targetPort = 5174
  autoLaunch = false

